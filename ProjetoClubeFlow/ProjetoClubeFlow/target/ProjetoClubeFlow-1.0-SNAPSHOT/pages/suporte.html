
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Suporte · Club Flow</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/colors.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/suporte.css">
</head>

<body>

    <main class="signup">

        <header class="site-header">
            <a class="brand" href="../index.html">
                <span class="brand-icon"></span>
                <span>CLUB <em>FLOW</em></span>
            </a>
        </header>

        <section class="signup-layout">

            <section>
                <p class="eyebrow">SUPORTE / CLUB FLOW</p>

                <h1>
                    Como podemos<br>
                    <span style="color:var(--primary-green)">ajudar?</span>
                </h1>

                <p>
                    Converse com nosso assistente virtual
                    e tire suas dúvidas sobre a plataforma.
                </p>
            </section>

            <section class="signup-card chat-card">

                <div class="chat-header">
                    <div>
                        <h2>Assistente Club Flow</h2>
                        <p>Online · Assistente virtual</p>
                    </div>
                </div>

                <div id="mensagens" class="chat-messages">

                    <div class="mensagem assistente">
                        Olá! Sou o assistente virtual do Club Flow.
                        Como posso ajudar?
                    </div>

                </div>

                <form id="formChat" class="chat-form">

                    <textarea
                        id="mensagem"
                        rows="2"
                        placeholder="Digite sua dúvida..."
                        required
                    ></textarea>

                    <button type="submit" id="enviarMensagem">
                        Enviar
                    </button>

                </form>

                <div class="form-actions">
                    <a class="btn" href="dashboard-atleta.html">
                        Voltar
                    </a>
                </div>

            </section>

        </section>

    </main>

    <script src="../js/suporte.js"></script>

</body>
</html>
