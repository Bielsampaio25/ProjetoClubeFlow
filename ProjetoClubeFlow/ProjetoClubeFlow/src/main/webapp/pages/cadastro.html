<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cadastro do Atleta · Club Flow</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/colors.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>
    <main class="signup">
        
        <header class="site-header">
            <a class="brand" href="../index.html">
                <span class="brand-icon"></span>
                <span>CLUB<em>FLOW</em></span>
            </a>
                <a href="../index.html" class="btn">← Voltar</a>
            </header>
        
            <div class="signup-layout">
            <section>
                <p class="eyebrow">CADASTRO DO ATLETA</p>
                <h1>Mostre seu<br><span style="color:var(--primary-green)">talento.</span><br>Encontre sua<br><span
                        style="color:var(--primary-green)">oportunidade.</span></h1>
                <p>Crie um perfil completo para tornar o seu futebol mais fácil de encontrar por clubes, scouts e
                    profissionais.</p>
            </section>
            <section class="signup-card">
                <div class="steps"><i class="step active"></i><i class="step"></i><i class="step"></i><i
                        class="step"></i></div>
                <p class="eyebrow">ETAPA 01 / 04</p>
                <h2>Dados pessoais</h2>
                <div class="form-grid" style="margin-top:25px">
                    <div class="field"><label>Nome completo</label><input placeholder="Gabriel Almeida"></div>
                    <div class="field"><label>Data de nascimento</label><input type="date"></div>
                    <div class="field"><label>CPF</label><input placeholder="000.000.000-00"></div>
                    <div class="field"><label>Cidade</label><input placeholder="São Paulo"></div>
                    <div class="field full-width"><label>E-mail</label><input type="email" placeholder="gabriel@email.com">
                    </div>
                    <div class="field full-width"><label>☐ Aceito os Termos de Uso e a Política de Privacidade</label></div>
                </div>
                <div class="form-actions"><a class="btn" href="../index.html">Cancelar</a><a class="btn primary"
                        href="perfil-esportivo.html">Continuar →</a></div>
            </section>
        </div>
    </main>
</body>

</html>
