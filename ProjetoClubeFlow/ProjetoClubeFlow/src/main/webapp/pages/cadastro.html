<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cadastro do Atleta</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/colors.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>
    <main class="signup">

        <header class="site-header">
            <a class="brand" href="../index.html">
                <img src="../assets/logo/logo_ClubeFlow.png" alt="" class="brand-icon">
            </a>
            <a href="../index.html" class="btn">← Voltar</a>
        </header>

        <div class="signup-layout">
            
            <section>
                <p class="eyebrow">CADASTRO DO ATLETA</p>
                <h1>Mostre seu<br>
                <span style="color:var(--primary-green)">talento.</span>
                <br>Encontre sua<br><span
                        style="color:var(--primary-green)">oportunidade.</span>
                </h1>
                <p>Crie um perfil completo para tornar o seu futebol mais fácil de encontrar por clubes, scouts e
                    profissionais.</p>
            </section>
            
            <section class="signup-card">
                <div class="steps">
                    <i class="step active"></i>
                    <i class="step"></i>
                    <i class="step"></i>
                    <i class="step"></i>
                </div>
                <p class="eyebrow">ETAPA 01 / 04</p>
                <h2>Dados pessoais</h2>
                
                <form action="/dadosPessoaisAtleta" method="POST" class="form-grid" style="margin-top:25px">
                    
                    <div class="field">
                        <label>Nome completo</label>
                        <input type="text" placeholder="Digite Seu Nome" id="nome">
                    </div>
                    <div class="field">
                        <label>Data de nascimento</label>
                        <input type="date" id="dtaNascimento">
                    </div>
                    <div class="field">
                        <label>CPF</label>
                        <input type="text" placeholder="000.000.000-00" id="cpf">
                    </div>
                    <div class="field">
                        <label>Cidade</label>
                        <input type="text" placeholder="Digite sua cidade" id="cidade">
                    </div>
                    <div class="field full-width">
                        <label>E-mail</label>
                        <input type="email" placeholder="Digite Seu Email" id="email">
                    </div>
                    <div class="termos">
                        <input type="checkbox" id="termos">Aceito os <span><a href="">Termos de Uso</a></span> e a <span><a href="">Política de Privacidade</a></span></input>
                    </div>
                <div class="form-actions">
                    <a class="btn" href="../index.html">Cancelar</a>
                    <a href="perfil-esportivo.html" class="btn">Continuar →</a>
                </div>
                 </form>
            </section>
    </main>
</body>

</html>
