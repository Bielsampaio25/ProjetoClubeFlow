<!doctype html>
<html lang="pt-BR">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Cadastro do Atleta</title>
        <link rel="stylesheet" href="../css/reset.css">
        <link rel="stylesheet" href="../css/colors.css">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/cadastro.css">
    </head>

    <body>
        <main class="signup">

            <header class="site-header">
                <a class="brand" href="../index.html">
                    <img src="../assets/logo/logo_ClubeFlow.png" alt="" class="brand-icon">
                </a>
                <a href="../index.html" class="btn">← Voltar</a>
            </header>

            <div class="signup-layout">

                <section>
                    <p class="eyebrow">CADASTRO DO ATLETA</p>
                    <h1>Mostre seu<br>
                        <span style="color:var(--primary-green)">talento.</span>
                        <br>Encontre sua<br><span
                            style="color:var(--primary-green)">oportunidade.</span>
                    </h1>
                    <p>Crie um perfil completo para tornar o seu futebol mais fácil de encontrar por clubes, scouts e
                        profissionais.</p>
                </section>

                <section class="signup-card">
                    <div class="steps">
                        <i class="step active"></i>
                        <i class="step"></i>
                        <i class="step"></i>
                    </div>
                    <p class="eyebrow">ETAPA 01 / 03</p>
                    <h2>Dados pessoais</h2>


                    <form action="../dadosPessoaisAtleta" method="POST" class="form-grid" style="margin-top:25px">

                        <div class="field">
                            <label for="nome">Nome completo</label>
                            <input type="text" name="nome" id="nome"
                                   placeholder="Digite seu nome" required>
                        </div>

                        <div class="field">
                            <label for="dtaNascimento">Data de nascimento</label>
                            <input type="date" name="dtaNascimento"
                                   id="dtaNascimento" required>
                        </div>

                        <div class="field">
                            <label for="cpf">CPF</label>
                            <input type="text" name="cpf" id="cpf"
                                   placeholder="000.000.000-00" required>
                        </div>

                        <div class="field">
                            <label for="cidade">Cidade</label>
                            <input type="text" name="cidade" id="cidade" required>
                        </div>

                        <div class="field">
                            <label for="estado">Estado</label>
                            <input type="text" name="estado" id="estado" required>
                        </div>

                        <div class="field full-width">
                            <label for="email">E-mail</label>
                            <input type="email" name="email" id="email" required>
                        </div>

                        <div class="field full-width">
                            <label for="telefone">Telefone</label>
                            <input type="text" name="telefone" id="telefone" required>
                        </div>

                        <div class="field full-width">
                            <label for="senha">Senha</label>
                            <input type="password" name="senha" id="senha" required>
                        </div>

                        <div class="termos">
                            <input type="checkbox" id="termos" required>
                            Aceito os termos de uso e a política de privacidade.
                        </div>

                        <div class="form-actions">
                            <a class="btn" href="../index.html">Cancelar</a>
                            <button type="submit" class="btn">Continuar →</button>
                        </div>

                    </form>

                </section>
        </main>
    </body>

</html>
