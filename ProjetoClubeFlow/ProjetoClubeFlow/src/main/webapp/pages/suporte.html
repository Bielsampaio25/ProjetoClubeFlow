<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Suporte · Club Flow</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/colors.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/suporte.css">
</head>

<body>
    <main class="signup">
        <header class="site-header"><a class="brand" href="../index.html"><span class="brand-icon"></span><span>CLUB
                    <em>FLOW</em></span></a></header>
        <div class="signup-layout">
            <section>
                <p class="eyebrow">SUPORTE / CLUB FLOW</p>
                <h1>Como podemos<br><span style="color:var(--primary-green)">ajudar?</span></h1>
                <p>Envie sua dúvida para nossa equipe de suporte.</p>
            </section>
            <section class="signup-card">
                <h2>Fale com o suporte</h2>
                <div class="field" style="margin-top:25px">
                    <label>ASSUNTO</label>
                    <input placeholder="Como podemos ajudar?" id="assunto">
                </div>
                <div class="field">
                    <label>MENSAGEM</label>
                    <textarea rows="6" placeholder="Descreva sua dúvida..." id="duvida"></textarea>
                </div>
                <div class="form-actions">
                    <a class="btn" href="login.html">Voltar</a>
                    <button class="btn primary" type="submit">Enviar mensagem →</button>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
